[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schema-impact-agent"
version = "0.0.1"
description = "LangGraph agent that predicts which downstream SQL models and columns break (or silently change) when a schema changes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.24",
    "ollama>=0.6.3",
    "sqlglot>=25",
]

[dependency-groups]
bench = [
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.1",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/schema_impact"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
